<!--  . . . . .  . . . . . .INTERNAL CSS . . . .  . . . . . . . .  . . .  . . -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> INTERNAL CSS</title>
    <style>
        h1{
            color: deeppink ;
            background-color: indigo;
        }
    </style>
    
<!-- Internal CSS reffers to adding a <style> tag after the <title> tag.
    Inside style tag we put the selector tag and its properties(colours,fonts,etc) -->

<body>
    <h1>
        About me
    </h1>
    <div>
        Name: Siddhant. 
        Age: 20.
        Occupation: Student.
        Address: jabalpur.
        COuntry: INDIA.
    </div>
</body>
</html>
<!-- Internal CSS was further optimised by external css, as we start adding properties the style tag would grow respectivly,
 and to prevent this from happening external css is used where all the styles are kept in an external file. -->
